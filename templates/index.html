<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>T20 Cricket Score Predictor</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 15px; }
        .container { max-width: 500px; margin: 0 auto; background: #1e293b; padding: 20px; border-radius: 10px; }
        h1 { text-align: center; color: #38bdf8; font-size: 20px; margin-bottom: 15px; }
        .form-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 4px; font-weight: bold; font-size: 13px; }
        select, input { width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #2563eb; color: white; border: none; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .result { margin-top: 15px; padding: 12px; background: #065f46; border-radius: 6px; text-align: center; font-size: 16px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏏 T20 Final Score Predictor</h1>
        <form method="POST" action="/">
            <div class="form-group">
                <label>Batting Team</label>
                <select name="batting_team" required>
                    {% for team in teams %}
                        <option value="{{ team }}">{{ team }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label>Bowling Team</label>
                <select name="bowling_team" required>
                    {% for team in teams %}
                        <option value="{{ team }}">{{ team }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label>Host City</label>
                <select name="city" required>
                    {% for city in cities %}
                        <option value="{{ city }}">{{ city }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label>Current Score (Runs)</label>
                <input type="number" name="current_score" min="0" required placeholder="e.g. 75">
            </div>
            <div class="form-group">
                <label>Overs Completed (> 5)</label>
                <input type="number" step="0.1" name="overs" min="5" max="20" required placeholder="e.g. 8.2">
            </div>
            <div class="form-group">
                <label>Wickets Fallen</label>
                <input type="number" name="wickets" min="0" max="9" required placeholder="e.g. 2">
            </div>
            <div class="form-group">
                <label>Runs in Last 5 Overs</label>
                <input type="number" name="last_five" min="0" required placeholder="e.g. 42">
            </div>
            <button type="submit">Predict Score</button>
        </form>

        {% if prediction %}
            <div class="result">
                Predicted Final Score: {{ prediction }} Runs
            </div>
        {% endif %}
    </div>
</body>
</html>
